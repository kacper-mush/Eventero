version: 2
updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # ESLint 10 broke eslint-plugin-react (used transitively by
      # eslint-config-next). Hold on v9 until the Next.js config supports v10.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
    groups:
      # Bundle minor + patch updates into one PR per group to reduce noise.
      # Major updates still come as individual PRs so they get reviewed carefully.
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  # GitHub Actions versions in .github/workflows/*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
